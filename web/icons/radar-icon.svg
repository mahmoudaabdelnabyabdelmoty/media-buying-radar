<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00bbff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00f5d4" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Middle Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#00f5d4" stroke-width="1.2" opacity="0.5"/>
  <!-- Glow Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#radarGlow)"/>

  <!-- Crosshairs -->
  <line x1="5" y1="50" x2="95" y2="50" stroke="#00d2ff" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
  <line x1="50" y1="5" x2="50" y2="95" stroke="#00d2ff" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- Rotating Sweep Arc Wedge -->
  <path d="M 50 50 L 50 5 A 45 45 0 0 1 88 28 Z" fill="url(#sweepGrad)" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Signal Dots -->
  <circle cx="68" cy="35" r="3" fill="#00f5d4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="62" r="2.5" fill="#ff4d6d">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="62" cy="72" r="2.2" fill="#ffd166">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Hub -->
  <circle cx="50" cy="50" r="4.5" fill="#00f5d4"/>
  <circle cx="50" cy="50" r="2" fill="#ffffff"/>
</svg>
